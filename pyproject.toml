# Self-contained in-tree build backend (PEP 517, stdlib only): `pip install .`
# needs no network, so it works behind unreachable internal package indexes.
[build-system]
requires = []
build-backend = "bunchrender_backend"
backend-path = ["_build"]

[project]
name = "bunchrenderer"
version = "0.2.0"
description = "Render particle-beam track data (g4beamline / CSV) as animated, studio-lit Blender scenes: real-space flight, phase-space projections, and convex-hull beam envelopes."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "BunchRenderer contributors" }]
keywords = ["g4beamline", "blender", "accelerator", "beam", "phase-space", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.scripts]
bunchrender = "bunchrenderer.cli:main"

[tool.setuptools]
packages = ["bunchrenderer"]

[tool.setuptools.package-data]
bunchrenderer = ["blender/*.py", "docker/Dockerfile"]
